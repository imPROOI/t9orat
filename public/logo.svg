<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <rect width="500" height="420" fill="#000000"/>

  <defs>
    <!-- Gradient for curves -->
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.45" />
    </linearGradient>
    <!-- Glow filter for center node -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Faint connector lines -->
  <g stroke="#FFFFFF" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" opacity="0.18">
    <line x1="160" y1="180" x2="250" y2="160" />
    <line x1="340" y1="180" x2="250" y2="160" />
    <line x1="210" y1="110" x2="250" y2="160" />
    <line x1="290" y1="110" x2="250" y2="160" />
    <line x1="210" y1="110" x2="340" y2="180" />
    <line x1="290" y1="110" x2="160" y2="180" />
  </g>

  <!-- Main curves with gradient -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 160 180 C 160 250, 340 250, 340 180" stroke="url(#curveGrad)" stroke-width="8" />
    <path d="M 160 180 C 100 110, 150 50, 210 110" stroke="url(#curveGrad)" stroke-width="8" />
    <path d="M 340 180 C 400 110, 350 50, 290 110" stroke="url(#curveGrad)" stroke-width="8" />
  </g>

  <!-- Outer nodes (balanced, reduced) -->
  <g fill="#FFFFFF">
    <circle cx="210" cy="110" r="9" />
    <circle cx="290" cy="110" r="9" />
    <circle cx="160" cy="180" r="6.5" />
    <circle cx="340" cy="180" r="6.5" />
  </g>

  <!-- Center glowing discovery node -->
  <circle cx="250" cy="160" r="12" fill="#FFFFFF" opacity="0.08" filter="url(#glow)" />
  <circle cx="250" cy="160" r="5.5" fill="none" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)" />

  <!-- Wordmark — tightly stacked below mark -->
  <text x="250" y="308" font-family="'ThmanyahSans', 'Tajawal', 'Arial', sans-serif" font-size="52" fill="#FFFFFF" text-anchor="middle" font-weight="bold" letter-spacing="1">تصورات</text>
  <text x="250" y="337" font-family="'ThmanyahSans', sans-serif" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="normal" letter-spacing="7" opacity="0.75">T9ORAT</text>
  <text x="250" y="360" font-family="'ThmanyahSans', sans-serif" font-size="9.5" fill="#FFFFFF" text-anchor="middle" font-weight="normal" letter-spacing="3.5" opacity="0.35">NEURAL EXPLORATION</text>
</svg>
